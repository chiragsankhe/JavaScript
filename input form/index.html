<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header" onclick=myFunction()>
        <h1>Student info</h1>
    </header>
    <form id="form1" action="submit">
        <h3>Personal info</h3>
        <label for="fullname ">Enter full name </label> <br>
        <input type="text" id="fullname" name="fullname" placeholder="name">
        <br>
        <label for="age">Enter age </label><br>
        <input id="age" type="number" placeholder="10"><br>
        <h3>school info</h3>
        <label for="schoolname">Enter school name </label><br>
        <input type="text" placeholder="school name " name="schoolname">
        <br>
        <label for="class"> class</label><br>
        <input type="number" name="class" id="class" value="1" min="1" max="10">
        <br>
        <label for="division"> division</label><br>
        <select id="div" name="div">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>

        </select>
        <br>
        <label for="subject"> select subject</label> <br>
        <input type="checkbox" id="sub1" name="sub1" value="maths">
        <label for="sub1">Maths</label>
        <input type="checkbox" id="sub2" name="sub2" value="english">
        <label for="sub1">english</label>
        <input type="checkbox" id="sub3" name="sub3" value="science">
        <label for="sub1">science</label>
        <input type="checkbox" id="sub4" name="sub4" value="computer">
        <label for="sub1">computer</label>
        <br>

        <h3>contact info</h3>

        <label for="phone no ">phone no</label><br>
        <input type="tel" id="phone" name="phone" placeholder="123-45-678" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" required>
        <br>
        <label for="email">Email  </label><br>
        <input type="email" name="email" placeholder="example@.com">

        <br>

        <button type="button" onclick="alert('your form is submitted')">submit</button>







    </form>



    <script src="script.js"></script>
</body>

</html>
